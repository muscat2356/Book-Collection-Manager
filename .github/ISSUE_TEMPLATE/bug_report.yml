name: バグ修正
description: 不具合の報告・修正依頼です。ブランチ接頭辞は bug/ を使います。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます！以下の項目を埋めてください。
        着手ブランチは `担当分野/bug/機能ID番号`（例: `front/bug/04`）で作成します。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような不具合かを簡潔に記載してください。
      placeholder: 例）貸出ボタンを押しても在庫数が減らない。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合を再現する手順を順番に記載してください。
      placeholder: |
        1. 蔵書一覧を開く
        2. 対象の書籍で「貸出」を押す
        3. 在庫数が変化しない
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 期待する挙動 / 実際の挙動
      description: 本来どうなるべきか、実際にどうなったかを記載してください。
      placeholder: |
        期待: 在庫数が 1 減る
        実際: 在庫数が変わらない
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 担当分野
      description: ブランチ命名の1階層目（front / back）になります。
      options:
        - front
        - back
    validations:
      required: true
  - type: input
    id: feature-id
    attributes:
      label: 関連機能ID
      description: README の機能ID。ブランチ命名の3階層目（番号のみ）になります。
      placeholder: 例）F-04（ブランチ → front/bug/04）
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 環境・補足
      description: ブラウザ、OS、ログ、スクリーンショットなど補足があれば記載してください。
      placeholder: 例）Chrome 126 / macOS / API ログにスタックトレースあり
    validations:
      required: false
