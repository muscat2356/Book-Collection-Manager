openapi: 3.1.0
info:
  title: LibraShare API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: |
    LibraShare MVP-A の API 仕様です。
    認証には Keycloak が発行した Bearer JWT を使用します。

    - `general_employee`: 書誌参照、利用者 CRUD、貸出/返却、貸出中一覧
    - `admin_employee`: 上記に加えて書誌 CRUD
    - `general_user`: 本 API の利用対象外

    注意:
    - 利用者削除時の `409 USER_HAS_ACTIVE_LOANS` は実装予定を含む正式仕様です。
    - 所蔵削除 `DELETE /api/books/{id}/copies/{copyId}` は別 Issue で実装継続中ですが、契約は本仕様を正とします。
servers:
  - url: http://localhost:8081
    description: Docker Compose のバックエンド
tags:
  - name: Books
    description: 書誌 API
  - name: BookCopies
    description: 所蔵 API
  - name: Users
    description: 貸出対象利用者 API
  - name: Loans
    description: 貸出・返却 API
security:
  - bearerAuth: []

paths:
  /api/books:
    get:
      tags: [Books]
      operationId: findAllBooks
      summary: 書誌一覧を取得
      description: |
        論理削除されていない書誌を全件取得します。
        現在の実装では一覧でも `holdings` を含み、通常は空配列です。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
              example:
                - id: 1
                  title: リーダブルコード
                  author: Dustin Boswell
                  isbn: 978-4-87311-565-8
                  totalCount: 3
                  availableCount: 2
                  holdings: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Books]
      operationId: createBook
      summary: 書誌を登録
      description: |
        書誌と `initialCopyCount` 件の所蔵を登録します。
        現在の実装では `initialCopyCount` が省略または null の場合は 0 件として扱います。
        権限: `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
            example:
              title: リーダブルコード
              author: Dustin Boswell
              isbn: 978-4-87311-565-8
              initialCopyCount: 3
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 3
                holdings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/books/{id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Books]
      operationId: findBookById
      summary: 書誌詳細を取得
      description: |
        論理削除されていない書誌を、所蔵一覧つきで取得します。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 2
                holdings:
                  - id: 12
                    status: AVAILABLE
                  - id: 14
                    status: LOANED
                  - id: 15
                    status: AVAILABLE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Books]
      operationId: updateBook
      summary: 書誌を更新
      description: |
        書誌情報を更新します。
        現在の実装では作成時と同じ `BookRequest` を受け取りますが、
        `initialCopyCount` は更新処理で使用しません。
        権限: `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
            example:
              title: リーダブルコード 改訂版
              author: Dustin Boswell
              isbn: 978-4-87311-565-8
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード 改訂版
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 2
                holdings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Books]
      operationId: deleteBook
      summary: 書誌を論理削除
      description: |
        `books.deleted` を true に更新します。
        貸出中の所蔵がある場合は削除できません。
        権限: `admin_employee`
      responses:
        "204":
          description: 論理削除成功（ボディなし）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 貸出中所蔵があるため削除不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: COPY_NOT_DELETABLE
                message: 貸出中、または貸出履歴がある所蔵のため削除できません
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/books/{id}/copies:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [BookCopies]
      operationId: createBookCopy
      summary: 所蔵を1冊追加
      description: |
        指定した書誌に所蔵を 1 冊追加します。
        追加される所蔵の `status` は `AVAILABLE` です。
        権限: `admin_employee`
      responses:
        "201":
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopiesResponse"
              example:
                id: 16
                status: AVAILABLE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/books/{id}/copies/{copyId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/CopyId"
    delete:
      tags: [BookCopies]
      operationId: deleteBookCopy
      summary: 所蔵を1冊削除
      description: |
        指定した書誌配下の所蔵を 1 冊削除します。
        `AVAILABLE` かつ貸出履歴のない所蔵のみ削除できます。
        本仕様を正式契約とし、実装は別 Issue で継続中です。
        権限: `admin_employee`
      responses:
        "204":
          description: 削除成功（ボディなし）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 貸出中、または貸出履歴があるため削除不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: COPY_NOT_DELETABLE
                message: 貸出中、または貸出履歴がある所蔵のため削除できません
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users:
    get:
      tags: [Users]
      operationId: findAllUsers
      summary: 利用者一覧を取得
      description: |
        `is_active=true` の利用者のみ取得します。
        `includeInactive` クエリは MVP-A では未対応です。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
              example:
                - id: 10
                  keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                  displayName: 山田 太郎
                  email: yamada@example.com
                  isActive: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Users]
      operationId: createUser
      summary: 利用者を登録
      description: |
        Keycloak に利用者を作成し、temporary パスワードと `general_user` ロールを設定してから、
        アプリ DB に保存します。
        権限: `general_employee` / `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              displayName: 山田 太郎
              email: yamada@example.com
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 10
                keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                displayName: 山田 太郎
                email: yamada@example.com
                isActive: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Keycloak 上で同一 email の利用者が既に存在する
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: USER_ALREADY_EXISTS
                message: このメールアドレスは既に使用されています
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: findUserById
      summary: 利用者詳細を取得
      description: |
        ID が一致すれば、無効化済みの利用者も取得対象です。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 10
                keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                displayName: 山田 太郎
                email: yamada@example.com
                isActive: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: 利用者を更新
      description: |
        アプリ DB を更新してから Keycloak のメールアドレスを更新します。
        別利用者とメールアドレスが重複する場合は 409 を返します。
        権限: `general_employee` / `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              displayName: 山田 太郎
              email: yamada.taro@example.com
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 10
                keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                displayName: 山田 太郎
                email: yamada.taro@example.com
                isActive: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: メールアドレス重複
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: EMAIL_ALREADY_EXISTS
                message: このメールアドレスは既に使用されています
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: 利用者を論理削除
      description: |
        アプリ DB の `is_active` を false に更新し、Keycloak の利用者を無効化します。
        貸出中の書籍がある利用者は削除できません。
        権限: `general_employee` / `admin_employee`
      responses:
        "204":
          description: 論理削除成功（ボディなし）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 貸出中の書籍があるため削除不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: USER_HAS_ACTIVE_LOANS
                message: 貸出中の書籍があるため削除できません
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/loans:
    post:
      tags: [Loans]
      operationId: createLoans
      summary: 複数所蔵を一括貸出
      description: |
        利用者 1 名に対して複数所蔵を 1 リクエストで一括貸出します。
        1 件でも貸出不可の所蔵が含まれる場合、全件ロールバックして 409 を返します。
        権限: `general_employee` / `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoansRequest"
            example:
              userId: 10
              bookCopyIds: [12, 15]
      responses:
        "201":
          description: 貸出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoansPostResponse"
              example:
                loans:
                  - id: 42
                    bookCopyId: 12
                    bookId: 1
                    bookTitle: リーダブルコード
                    userId: 10
                    borrowedAt: "2026-06-30T10:00:00Z"
                    returnedAt: null
                    status: BORROWED
                  - id: 43
                    bookCopyId: 15
                    bookId: 1
                    bookTitle: リーダブルコード
                    userId: 10
                    borrowedAt: "2026-06-30T10:00:00Z"
                    returnedAt: null
                    status: BORROWED
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 利用者状態不正、または貸出不可の所蔵が含まれる
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/LoansPostErrorResponse"
              examples:
                userNotFound:
                  summary: 利用者が存在しない
                  value:
                    error: USER_NOT_FOUND
                    message: 該当ユーザーが見つかりません
                userNotActive:
                  summary: 利用者が無効
                  value:
                    error: USER_NOT_ACTIVE
                    message: 該当ユーザーは貸し出しできません
                copyNotAvailable:
                  summary: 貸出不可の所蔵が含まれる
                  value:
                    error: COPY_NOT_AVAILABLE
                    message: 貸出できない所蔵が含まれています
                    failedBookCopyIds: [15]
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/loans/{id}/return:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    put:
      tags: [Loans]
      operationId: returnLoan
      summary: 貸出を返却
      description: |
        指定した貸出を返却し、対応する所蔵を `AVAILABLE` に戻します。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 返却成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoansResponse"
              example:
                id: 42
                bookCopyId: 12
                bookId: 1
                bookTitle: リーダブルコード
                userId: 10
                borrowedAt: "2026-06-30T10:00:00Z"
                returnedAt: "2026-07-07T15:30:00Z"
                status: RETURNED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 既に返却済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: LOAN_ALREADY_RETURNED
                message: 既に返却済みです。
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/loans/active:
    get:
      tags: [Loans]
      operationId: findActiveLoans
      summary: 貸出中一覧を取得
      description: |
        `status=BORROWED` の貸出を、書誌・利用者情報つきで返します。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveLoanResponse"
              example:
                - id: 42
                  bookCopyId: 12
                  book:
                    id: 1
                    title: リーダブルコード
                    author: Dustin Boswell
                  user:
                    id: 10
                    displayName: 山田 太郎
                  borrowedAt: "2026-06-30T10:00:00Z"
                  returnedAt: null
                  status: BORROWED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak が発行した社員ロールを持つアクセストークン

  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: 書誌 ID
      schema:
        type: integer
        format: int64
    CopyId:
      name: copyId
      in: path
      required: true
      description: 所蔵 ID
      schema:
        type: integer
        format: int64
    UserId:
      name: id
      in: path
      required: true
      description: 利用者 ID
      schema:
        type: integer
        format: int64
    LoanId:
      name: id
      in: path
      required: true
      description: 貸出 ID
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: リクエスト形式または入力値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: VALIDATION_ERROR
            message: 入力内容が不正です
    Unauthorized:
      description: 未認証（Spring Security の既定レスポンス）
    Forbidden:
      description: 権限不足（Spring Security の既定レスポンス）
    NotFound:
      description: 対象リソースが存在しない（ボディなし）
    InternalServerError:
      description: サーバー内部エラーまたは Keycloak 連携失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INTERNAL_SERVER_ERROR
            message: サーバーエラーが発生しています。

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: 機械可読なエラーコード
        message:
          type: string
          description: 画面表示用メッセージ

    LoansPostErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message, failedBookCopyIds]
      properties:
        error:
          type: string
          enum: [COPY_NOT_AVAILABLE]
        message:
          type: string
        failedBookCopyIds:
          type: array
          items:
            type: integer
            format: int64

    CopyStatus:
      type: string
      enum: [AVAILABLE, LOANED]

    LoanStatus:
      type: string
      enum: [BORROWED, RETURNED]

    HoldingResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/CopyStatus"

    CopiesResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/CopyStatus"

    BookRequest:
      type: object
      additionalProperties: false
      description: |
        現在の DTO には Bean Validation 制約がありません。
        `initialCopyCount` は書誌更新時には使用されません。
      properties:
        title:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
        initialCopyCount:
          type:
            - integer
            - "null"
          format: int32
          description: 省略または null の場合は 0

    BookResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - author
        - isbn
        - totalCount
        - availableCount
        - holdings
      properties:
        id:
          type: integer
          format: int64
        title:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
