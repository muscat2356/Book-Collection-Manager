openapi: 3.1.0
info:
  title: LibraShare API
  version: 0.1.0
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: |
    `task/api/01` ブランチに実装されている書誌 API・利用者 API の仕様です。
    認証には Keycloak が発行した Bearer JWT を使用します。

    - `general_employee`: 書誌参照、利用者 CRUD
    - `admin_employee`: 上記に加えて書誌 CRUD
servers:
  - url: http://localhost:8081
    description: Docker Compose のバックエンド
tags:
  - name: Books
    description: 書誌 API
  - name: Users
    description: 貸出対象利用者 API
security:
  - bearerAuth: []

paths:
  /api/books:
    get:
      tags: [Books]
      operationId: findAllBooks
      summary: 書誌一覧を取得
      description: |
        論理削除されていない書誌を全件取得します。
        一覧では `holdings` は空配列です。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
              example:
                - id: 1
                  title: リーダブルコード
                  author: Dustin Boswell
                  isbn: 978-4-87311-565-8
                  totalCount: 3
                  availableCount: 2
                  holdings: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Books]
      operationId: createBook
      summary: 書誌を登録
      description: |
        書誌と `initialCopyCount` 件の所蔵を登録します。
        `initialCopyCount` が省略または null の場合は 0 件として扱います。
        レスポンスの `holdings` は空配列です。
        権限: `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
            example:
              title: リーダブルコード
              author: Dustin Boswell
              isbn: 978-4-87311-565-8
              initialCopyCount: 3
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 3
                holdings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/books/{id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Books]
      operationId: findBookById
      summary: 書誌詳細を取得
      description: |
        論理削除されていない書誌を、所蔵一覧つきで取得します。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 2
                holdings:
                  - id: 12
                    status: AVAILABLE
                  - id: 14
                    status: LOANED
                  - id: 15
                    status: AVAILABLE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Books]
      operationId: updateBook
      summary: 書誌を更新
      description: |
        書誌情報を更新します。現在の実装では作成時と同じ `BookRequest` を
        受け取りますが、`initialCopyCount` は更新処理で使用しません。
        レスポンスの `holdings` は空配列です。
        権限: `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
            example:
              title: リーダブルコード 改訂版
              author: Dustin Boswell
              isbn: 978-4-87311-565-8
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: 1
                title: リーダブルコード 改訂版
                author: Dustin Boswell
                isbn: 978-4-87311-565-8
                totalCount: 3
                availableCount: 2
                holdings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Books]
      operationId: deleteBook
      summary: 書誌を論理削除
      description: |
        `books.deleted` を true に更新します。
        現在の実装では貸出中所蔵の有無を検証しません。
        権限: `admin_employee`
      responses:
        "204":
          description: 論理削除成功（ボディなし）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users:
    get:
      tags: [Users]
      operationId: findAllUsers
      summary: 有効な利用者一覧を取得
      description: |
        `is_active=true` の利用者のみ取得します。
        `includeInactive` パラメータには対応していません。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
              example:
                - id: 10
                  keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                  displayName: 山田 太郎
                  email: yamada@example.com
                  isActive: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Users]
      operationId: createUser
      summary: 利用者を登録
      description: |
        Keycloak に利用者を作成してから、アプリ DB に保存します。
        権限: `general_employee` / `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              displayName: 山田 太郎
              email: yamada@example.com
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 10
                keycloakSub: 8d5f5c6e-1111-2222-3333-123456789abc
                displayName: 山田 太郎
                email: yamada@example.com
                isActive: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: findUserById
      summary: 利用者詳細を取得
      description: |
        ID が一致すれば、無効化済みの利用者も取得対象です。
        権限: `general_employee` / `admin_employee`
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: 利用者を更新
      description: |
        アプリ DB を更新してから Keycloak のメールアドレスを更新します。
        別利用者とメールアドレスが重複する場合は 409 を返します。
        権限: `general_employee` / `admin_employee`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
            example:
              displayName: 山田 太郎
              email: yamada.taro@example.com
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: メールアドレス重複
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: EMAIL_ALREADY_EXISTS
                message: このメールアドレスは既に使用されています
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: 利用者を論理削除
      description: |
        アプリ DB の `is_active` を false に更新した後、Keycloak の利用者を無効化します。
        現在の実装では貸出中の有無を検証しません。
        権限: `general_employee` / `admin_employee`
      responses:
        "204":
          description: 論理削除成功（ボディなし）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak が発行した社員ロールを持つアクセストークン

  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: 書誌 ID
      schema:
        type: integer
        format: int64
    UserId:
      name: id
      in: path
      required: true
      description: 利用者 ID
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: リクエスト形式または入力値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: VALIDATION_ERROR
            message: 入力内容が不正です
    Unauthorized:
      description: 未認証（Spring Security の既定レスポンス）
    Forbidden:
      description: 権限不足（Spring Security の既定レスポンス）
    NotFound:
      description: 対象リソースが存在しない（ボディなし）
    InternalServerError:
      description: サーバー内部エラーまたは Keycloak 連携失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INTERNAL_SERVER_ERROR
            message: サーバーエラーが発生しています。

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: 機械可読なエラーコード
        message:
          type: string
          description: 画面表示用メッセージ

    CopyStatus:
      type: string
      enum: [AVAILABLE, LOANED]

    HoldingResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/CopyStatus"

    BookRequest:
      type: object
      additionalProperties: false
      description: |
        現在の DTO には Bean Validation 制約がありません。
        `initialCopyCount` は書誌更新時には使用されません。
      properties:
        title:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
        initialCopyCount:
          type:
            - integer
            - "null"
          format: int32
          description: 省略または null の場合は 0

    BookResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - author
        - isbn
        - totalCount
        - availableCount
        - holdings
      properties:
        id:
          type: integer
          format: int64
        title:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
        totalCount:
          type: integer
          format: int32
          minimum: 0
        availableCount:
          type: integer
          format: int32
          minimum: 0
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingResponse"

    UserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, keycloakSub, displayName, email, isActive]
      properties:
        id:
          type: integer
          format: int64
        keycloakSub:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
